[workspace]
resolver = "3"
members = ["crates/collage-core", "crates/dimuli-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
thiserror = "2"
slint = "1.18"
slint-build = "1.18"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log = "0.4"
env_logger = "0.11"
jni = "0.22.4"
android_logger = { version = "0.15.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"
