# cargo-about configuration (build-time tool only, see scripts/update-licenses.sh).
# Only crates that end up in the Android APK are listed; dev/build dependencies are not shipped.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "0BSD",
    "OFL-1.1",
    "LicenseRef-Slint-Royalty-free-2.0",
]
targets = ["aarch64-linux-android", "x86_64-linux-android"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
